pluginManagement {
    repositories {
        gradlePluginPortal()
    }

    includeBuild('build-logic')
}

rootProject.name = 'openapi-schema'

// This build owns no projects of its own; it aggregates the composite so that
// `./gradlew build` and the release plugin still act on everything.
includeBuild('plugin-build')
includeBuild('example-build')

apply from: 'gradle/shared-catalogs.settings.gradle'
