version: 1
name: Simple task
description: implement a simple task → test → review → push → wait for CI → open PR

defaults:
  permission_mode: auto
  model: opus

stages:
  - id: implement
    title: Implement the task
    prompt_header_file: .clauckpit/prompts/implement-header.md
    prompt_header_revision_file: .clauckpit/prompts/implement-header-revision.md
    tasks:
      - id: implement
        type: claude
        prompt_file: .clauckpit/prompts/implement.md

  - id: test
    title: Tests
    on_fail: { goto: implement, max: 3 }
    tasks:
      - use: .clauckpit/tasks/test-plugin.yml
      - use: .clauckpit/tasks/test-example.yml
      - use: .clauckpit/tasks/test-example-jackson2.yml
      - use: .clauckpit/tasks/test-example-jakarta-3.yml
      - use: .clauckpit/tasks/test-springboot.yml

  - id: review
    title: Review the task
    on_fail: { goto: implement, max: 3 }
    prompt_footer_file: .clauckpit/prompts/review-footer.md
    tasks:
      - id: task
        type: claude
        prompt_file: .clauckpit/prompts/review-task.md

  - id: push
    title: Push branch
    tasks:
      - use: .clauckpit/tasks/push-branch.yml

  - id: ci
    title: Wait for GitHub CI
    on_fail: { goto: implement, max: 2 }
    tasks:
      - use: .clauckpit/tasks/wait-for-ci.yml

  - id: pr
    title: Open pull request
    approval: manual
    tasks:
      - use: .clauckpit/tasks/open-pr.yml
